name: Windows installer

# Builds QueueSetup.exe (server + counter mini-window app) on a Windows machine.
#   - Run it by hand: Actions tab -> "Windows installer" -> Run workflow
#   - Or push a version tag (git tag v1.0.0 && git push --tags) to also publish a Release
#   - Or push changes to the app (main branch) to check that it still builds
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'windows/**'
      - '.github/workflows/windows-installer.yml'

permissions:
  contents: write # lets a tag build attach the installer to a Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            windows/requirements-build.txt

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make sure Inno Setup is installed
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }

      - name: Work out the version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') } else { $v = "0.0.$env:GITHUB_RUN_NUMBER" }
          "value=$v" >> $env:GITHUB_OUTPUT

      - name: Build installer
        shell: cmd
        run: windows\build.bat ${{ steps.version.outputs.value }}

      - uses: actions/upload-artifact@v4
        with:
          name: QueueSetup
          path: windows/output/QueueSetup.exe
          if-no-files-found: error

      - name: Attach to the Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: windows/output/QueueSetup.exe
